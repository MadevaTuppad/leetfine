<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LeetFine — squad fine tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #F3F4FA;
      --surface: #FFFFFF;
      --surface-2: #F7F8FC;
      --border: #E7E8F2;
      --ink: #15162B;
      --muted: #82849C;
      --accent: #FF6B35;
      --accent-soft: #FFE7DA;
      --mint: #00C08A;
      --mint-soft: #D9F7EC;
      --purple: #7C5CFC;
      --purple-soft: #ECE7FF;
      --blue: #2F8FFF;
      --blue-soft: #E2EFFF;
      --danger: #FF3B5C;
      --sora: 'Sora', sans-serif;
      --inter: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--inter);
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 100%;
      max-width: 440px;
      min-height: 100vh;
      background: var(--surface);
      box-shadow: 0 0 60px rgba(21, 22, 43, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* app bar */
    .appbar {
      padding: 20px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sora);
      font-weight: 800;
      color: #fff;
      font-size: 16px;
      flex: none;
    }

    .brand-text h1 {
      font-family: var(--sora);
      font-size: 17px;
      font-weight: 800;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .brand-text p {
      margin: 0;
      font-size: 11.5px;
      color: var(--muted);
    }

    .avatars-mini {
      display: flex;
    }

    .avatars-mini .av {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sora);
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      margin-left: -8px;
    }

    /* views */
    .view {
      display: none;
      padding: 18px 20px 100px;
      flex: 1;
    }

    .view.active {
      display: block;
      animation: fadein .25s ease;
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-family: var(--sora);
      font-size: 15px;
      font-weight: 700;
      margin: 22px 0 12px;
    }

    .section-title:first-child {
      margin-top: 4px;
    }

    .hint {
      font-size: 12.5px;
      color: var(--muted);
      margin: -6px 0 16px;
      line-height: 1.5;
    }

    /* avatar picker */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .avatar-pick {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .avatar-pick .circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sora);
      font-weight: 800;
      font-size: 19px;
      color: #fff;
      border: 3px solid transparent;
      transition: .15s;
    }

    .avatar-pick.selected .circle {
      border-color: var(--ink);
      transform: scale(1.06);
    }

    .avatar-pick span {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }

    .avatar-pick.selected span {
      color: var(--ink);
    }

    /* date pills */
    .date-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pill {
      flex: 1;
      text-align: center;
      padding: 10px 6px;
      border-radius: 11px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      background: var(--surface);
      border: 1.5px solid var(--border);
      cursor: pointer;
    }

    .pill.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .date-custom {
      position: relative;
    }

    .date-custom input {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 11px 12px;
      font-family: var(--inter);
      font-size: 14.5px;
      color: var(--ink);
    }

    /* amount card */
    .amount-card {
      background: linear-gradient(135deg, var(--ink), #2A2C4C);
      border-radius: 16px;
      padding: 18px 18px 16px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .amount-left .lbl {
      font-size: 11px;
      color: #B9BAD1;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 600;
    }

    .amount-display {
      display: flex;
      align-items: baseline;
      gap: 2px;
      margin-top: 4px;
    }

    .amount-display .rs {
      font-family: var(--sora);
      font-size: 20px;
      font-weight: 700;
    }

    .amount-display input {
      background: none;
      border: none;
      color: #fff;
      font-family: var(--sora);
      font-size: 32px;
      font-weight: 800;
      width: 110px;
      outline: none;
      padding: 0;
    }

    .edit-toggle {
      width: 44px;
      height: 26px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      position: relative;
      cursor: pointer;
      flex: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .edit-toggle::after {
      content: '✎';
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #fff;
      color: var(--ink);
      transition: .15s;
    }

    .edit-toggle.on {
      background: var(--accent);
      border-color: var(--accent);
    }

    .edit-toggle.on::after {
      transform: translateX(18px);
    }

    /* note */
    .note-field {
      width: 100%;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 13px 14px;
      font-family: var(--inter);
      font-size: 14.5px;
      color: var(--ink);
    }

    .note-field::placeholder {
      color: var(--muted);
    }

    .cta {
      width: 100%;
      margin-top: 22px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-family: var(--sora);
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 10px 24px -8px rgba(255, 107, 53, 0.55);
    }

    .cta:disabled {
      opacity: .6;
      cursor: wait;
      box-shadow: none;
    }

    .cta .spin {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, .4);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
      display: none;
    }

    .cta.loading .spin {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .toast {
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      text-align: center;
    }

    .toast.ok {
      display: block;
      background: var(--mint-soft);
      color: #00795A;
    }

    .toast.err {
      display: block;
      background: #FFE3E8;
      color: #C81A3C;
    }

    /* dashboard */
    .hero-card {
      background: linear-gradient(135deg, var(--purple), var(--accent));
      border-radius: 20px;
      padding: 22px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .hero-card::after {
      content: '';
      position: absolute;
      right: -30px;
      top: -30px;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .hero-lbl {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(255, 255, 255, 0.85);
    }

    .hero-amt {
      font-family: var(--sora);
      font-size: 38px;
      font-weight: 800;
      margin-top: 4px;
    }

    .hero-sub {
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 2px;
    }

    .board-list {
      margin-top: 12px;
    }

    .board-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 9px;
    }

    .board-row .circle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sora);
      font-weight: 800;
      font-size: 14px;
      color: #fff;
    }

    .board-row .info {
      flex: 1;
      min-width: 0;
    }

    .board-row .name {
      font-weight: 700;
      font-size: 13.5px;
    }

    .bar-track {
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      margin-top: 6px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
    }

    .board-row .amt {
      font-family: var(--sora);
      font-weight: 800;
      font-size: 14.5px;
      flex: none;
    }

    .activity-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-item .circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--sora);
      font-weight: 800;
      font-size: 13px;
      color: #fff;
    }

    .activity-item .meta {
      flex: 1;
      min-width: 0;
    }

    .activity-item .name-line {
      font-weight: 700;
      font-size: 13.5px;
    }

    .activity-item .sub-line {
      font-size: 11.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .activity-item .amt-tag {
      font-family: var(--sora);
      font-weight: 800;
      font-size: 13px;
      color: var(--danger);
      background: #FFE3E8;
      padding: 5px 10px;
      border-radius: 10px;
      flex: none;
    }

    .empty-state {
      padding: 28px 10px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    /* bottom nav */
    .bottomnav {
      position: sticky;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
      gap: 6px;
    }

    .navbtn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px;
      border-radius: 12px;
      cursor: pointer;
      color: var(--muted);
    }

    .navbtn.active {
      color: var(--accent);
    }

    .navbtn svg {
      width: 21px;
      height: 21px;
    }

    .navbtn .lbl {
      font-size: 10.5px;
      font-weight: 700;
    }

    footer.credit {
      text-align: center;
      padding: 10px 0 2px;
      font-size: 10.5px;
      color: var(--muted);
    }

    footer.credit a {
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="phone">

    <div class="appbar">
      <div class="brand">
        <div class="mark">₹</div>
        <div class="brand-text">
          <h1>LeetFine</h1>
          <p>Madeva · Akshay · Nitish · Vinay</p>
        </div>
      </div>
      <div class="avatars-mini" id="miniAvatars"></div>
    </div>

    <!-- LOG VIEW -->
    <div class="view active" id="view-log">
      <div class="section-title">Who missed today?</div>
      <div class="avatar-grid" id="nameGrid"></div>

      <div class="section-title">When</div>
      <div class="date-card">
        <div class="pill-row">
          <div class="pill" id="todayChip">Today</div>
          <div class="pill" id="yestChip">Yesterday</div>
        </div>
        <div class="date-custom">
          <input type="date" id="dateInput">
        </div>
      </div>

      <div class="section-title">Fine amount</div>
      <div class="amount-card">
        <div class="amount-left">
          <div class="lbl">Amount due</div>
          <div class="amount-display">
            <span class="rs">₹</span>
            <input type="number" id="amountInput" value="100" readonly>
          </div>
        </div>
        <div class="edit-toggle" id="amountToggle"></div>
      </div>

      <div class="section-title">Note <span style="color:var(--muted);font-weight:400;">(optional)</span></div>
      <input type="text" class="note-field" id="noteInput" placeholder="e.g. slept through it 😅">

      <button class="cta" id="saveBtn">
        <span class="spin"></span><span id="saveBtnLabel">Log the fine →</span>
      </button>
      <div class="toast" id="statusBox"></div>
    </div>

    <!-- DASHBOARD VIEW -->
    <div class="view" id="view-board">
      <div class="hero-card">
        <div class="hero-lbl">Total fines collected</div>
        <div class="hero-amt" id="totalAmt">₹0</div>
        <div class="hero-sub" id="totalCount">0 entries logged</div>
      </div>

      <div class="section-title">Leaderboard</div>
      <div class="board-list" id="boardList"></div>

      <div class="section-title">Recent activity</div>
      <div id="entriesList"></div>
    </div>

    <div class="bottomnav">
      <div class="navbtn active" id="navLog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <div class="lbl">Log</div>
      </div>
      <div class="navbtn" id="navBoard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M4 20V10M12 20V4M20 20v-7" />
        </svg>
        <div class="lbl">Board</div>
      </div>
    </div>

    <footer class="credit">synced to google sheets · <a href="#" id="sheetLink" target="_blank">open sheet</a></footer>
  </div>

  <script>
    /* ======================================================
       CONFIG — paste your Apps Script Web App URL here
    ====================================================== */
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwt7pqYPNMKr3RCCVbFUNQUIU1LTcFOMz2JeNUQeSoWJci52IB2KNUJ95167fFQxaCPew/exec";
    const SHEET_VIEW_URL = "https://docs.google.com/spreadsheets/d/1j4GSvppehND3T1ximJm11JUhQ8yQAiiKGqpD3SV1SHc/edit?pli=1&gid=0#gid=0";

    const MEMBERS = [
      { name: "Madeva", color: "#7C5CFC" },
      { name: "Akshay", color: "#FF6B35" },
      { name: "Nitish", color: "#00C08A" },
      { name: "Vinay", color: "#2F8FFF" }
    ];
    function initials(n) { return n.slice(0, 2).toUpperCase(); }
    function colorFor(name) { const m = MEMBERS.find(x => x.name === name); return m ? m.color : "#82849C"; }

    let selectedName = null;

    document.getElementById('sheetLink').href = SHEET_VIEW_URL;

    /* mini avatars in app bar */
    document.getElementById('miniAvatars').innerHTML = MEMBERS.map(m =>
      `<div class="av" style="background:${m.color}">${initials(m.name)}</div>`
    ).join('');

    /* avatar picker */
    const nameGrid = document.getElementById('nameGrid');
    nameGrid.innerHTML = MEMBERS.map(m => `
  <div class="avatar-pick" data-name="${m.name}">
    <div class="circle" style="background:${m.color}">${initials(m.name)}</div>
    <span>${m.name}</span>
  </div>
`).join('');
    nameGrid.querySelectorAll('.avatar-pick').forEach(el => {
      el.addEventListener('click', () => {
        nameGrid.querySelectorAll('.avatar-pick').forEach(p => p.classList.remove('selected'));
        el.classList.add('selected');
        selectedName = el.dataset.name;
      });
    });

    /* bottom nav switching */
    const views = { log: document.getElementById('view-log'), board: document.getElementById('view-board') };
    const navs = { log: document.getElementById('navLog'), board: document.getElementById('navBoard') };
    function showView(key) {
      Object.keys(views).forEach(k => {
        views[k].classList.toggle('active', k === key);
        navs[k].classList.toggle('active', k === key);
      });
      if (key === 'board') loadEntries();
    }
    navs.log.addEventListener('click', () => showView('log'));
    navs.board.addEventListener('click', () => showView('board'));

    /* date helpers */
    const dateInput = document.getElementById('dateInput');
    function toISO(d) { return d.toISOString().slice(0, 10); }
    function setDate(offsetDays, chip) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      dateInput.value = toISO(d);
      document.getElementById('todayChip').classList.remove('active');
      document.getElementById('yestChip').classList.remove('active');
      if (chip) chip.classList.add('active');
    }
    setDate(0, document.getElementById('todayChip'));
    document.getElementById('todayChip').addEventListener('click', () => setDate(0, document.getElementById('todayChip')));
    document.getElementById('yestChip').addEventListener('click', () => setDate(-1, document.getElementById('yestChip')));
    dateInput.addEventListener('change', () => {
      document.getElementById('todayChip').classList.remove('active');
      document.getElementById('yestChip').classList.remove('active');
    });

    /* amount toggle */
    const amountToggle = document.getElementById('amountToggle');
    const amountInput = document.getElementById('amountInput');
    amountToggle.addEventListener('click', () => {
      const on = amountToggle.classList.toggle('on');
      amountInput.readOnly = !on;
      if (on) { amountInput.focus(); } else { amountInput.value = 100; }
    });

    /* save */
    const saveBtn = document.getElementById('saveBtn');
    const statusBox = document.getElementById('statusBox');

    saveBtn.addEventListener('click', async () => {
      statusBox.className = 'toast';
      if (!selectedName) { showStatus('err', 'Pick who missed it first'); return; }
      if (!dateInput.value) { showStatus('err', 'Pick a date'); return; }
      const amount = parseFloat(amountInput.value);
      if (!amount || amount <= 0) { showStatus('err', 'Enter a valid amount'); return; }
      if (GAS_URL.includes('PASTE_YOUR')) { showStatus('err', 'App not connected to sheet yet — see SETUP.md'); return; }

      saveBtn.disabled = true; saveBtn.classList.add('loading');
      document.getElementById('saveBtnLabel').textContent = 'Saving…';

      const payload = {
        name: selectedName,
        date: dateInput.value,
        amount: amount,
        note: document.getElementById('noteInput').value || ''
      };

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.ok) {
          showStatus('ok', '✓ Saved — ₹' + amount + ' logged for ' + selectedName);
          resetForm();
        } else {
          showStatus('err', data.error || 'Could not save, try again');
        }
      } catch (err) {
        showStatus('err', 'Network error — check your connection');
      }
      saveBtn.disabled = false; saveBtn.classList.remove('loading');
      document.getElementById('saveBtnLabel').textContent = 'Log the fine →';
    });

    function showStatus(type, msg) {
      statusBox.className = 'toast ' + type;
      statusBox.textContent = msg;
    }

    function resetForm() {
      nameGrid.querySelectorAll('.avatar-pick').forEach(p => p.classList.remove('selected'));
      selectedName = null;
      document.getElementById('noteInput').value = '';
      amountInput.value = 100;
      amountInput.readOnly = true;
      amountToggle.classList.remove('on');
      setDate(0, document.getElementById('todayChip'));
    }

    /* dashboard */
    async function loadEntries() {
      const listEl = document.getElementById('entriesList');
      const boardEl = document.getElementById('boardList');
      if (GAS_URL.includes('PASTE_YOUR')) {
        listEl.innerHTML = '<div class="empty-state">Connect the sheet in SETUP.md to see entries</div>';
        return;
      }
      try {
        const res = await fetch(GAS_URL + '?action=list');
        const data = await res.json();
        renderDashboard(data.entries || []);
      } catch (err) {
        listEl.innerHTML = '<div class="empty-state">Could not load entries — pull to refresh</div>';
      }
    }

    function formatRelativeDate(iso) {
      const today = toISO(new Date());
      const yest = toISO(new Date(Date.now() - 86400000));
      if (iso === today) return 'Today';
      if (iso === yest) return 'Yesterday';
      return iso;
    }

    function renderDashboard(entries) {
      const listEl = document.getElementById('entriesList');
      const boardEl = document.getElementById('boardList');
      const total = entries.reduce((s, e) => s + Number(e.amount || 0), 0);
      document.getElementById('totalAmt').textContent = '₹' + total;
      document.getElementById('totalCount').textContent = entries.length + ' entries logged';

      const perPerson = {};
      MEMBERS.forEach(m => perPerson[m.name] = 0);
      entries.forEach(e => { perPerson[e.name] = (perPerson[e.name] || 0) + Number(e.amount || 0); });
      const maxAmt = Math.max(1, ...Object.values(perPerson));

      const sortedMembers = [...MEMBERS].sort((a, b) => perPerson[b.name] - perPerson[a.name]);
      boardEl.innerHTML = sortedMembers.map(m => `
    <div class="board-row">
      <div class="circle" style="background:${m.color}">${initials(m.name)}</div>
      <div class="info">
        <div class="name">${m.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(perPerson[m.name] / maxAmt * 100)}%;background:${m.color}"></div></div>
      </div>
      <div class="amt">₹${perPerson[m.name]}</div>
    </div>
  `).join('');

      if (entries.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No fines yet — everyone\'s clean 🎉</div>';
        return;
      }

      const sorted = [...entries].reverse();
      listEl.innerHTML = sorted.map(e => `
    <div class="activity-item">
      <div class="circle" style="background:${colorFor(e.name)}">${initials(e.name)}</div>
      <div class="meta">
        <div class="name-line">${e.name}</div>
        <div class="sub-line">${formatRelativeDate(e.date)}${e.note ? ' · ' + escapeHtml(e.note) : ''}</div>
      </div>
      <div class="amt-tag">₹${e.amount}</div>
    </div>
  `).join('');
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    loadEntries();
  </script>
</body>

</html>
